<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishScope</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg class="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <h1>PhishScope</h1>
    </div>
  </div>

  <div class="content">
    <div class="url-container">
      <span class="label">URL</span>
      <div id="active-url" class="url-text truncate">Detecting...</div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="loading-state hidden">
      <div class="spinner"></div>
      <p>Analyzing URL...</p>
    </div>

    <!-- Error State -->
    <div id="error-state" class="error-state hidden">
      <p id="error-message">Unable to connect.</p>
    </div>

    <!-- Results State -->
    <div id="results" class="results-state hidden">
      
      <div class="verdict-banner" id="verdict-banner">
        <span id="verdict-text">SAFE</span>
      </div>

      <div id="trusted-badge" class="trusted-badge hidden mt-2 text-center" style="background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); border-radius: 6px; padding: 6px; color: #22C55E; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        Trusted Domain
      </div>

      <div class="grid-2 mt-3">
        <div class="stat-box">
          <span class="label">Confidence</span>
          <span class="value" id="confidence-val">--</span>
        </div>
        <div class="stat-box">
          <span class="label">Hybrid Score</span>
          <span class="value" id="hybrid-val">--</span>
        </div>
      </div>

      <div class="explanation-box mt-3" id="explanation-container">
        <span class="label">Summary</span>
        <p id="summary-text" class="summary-text">...</p>
        
        <div id="features-container" class="mt-2 hidden">
          <span class="label">Top Features</span>
          <ul id="features-list" class="feature-list">
            <!-- Features injected here -->
          </ul>
        </div>
      </div>
    </div>

    <!-- History Section -->
    <div class="history-section mt-4">
      <span class="label">Recently Analyzed</span>
      <ul id="history-list" class="history-list">
        <!-- History items injected here -->
      </ul>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
